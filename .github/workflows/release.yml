name: Publish model release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate model package
        run: pnpm run validate

      - name: Build release archives
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p "dist/pqcmm-${RELEASE_TAG}"
          cp -R model profiles schemas README.md CONTRIBUTING.md LICENSE "dist/pqcmm-${RELEASE_TAG}/"
          tar -C dist -czf "dist/pqcmm-${RELEASE_TAG}.tar.gz" "pqcmm-${RELEASE_TAG}"
          cd dist
          zip -qr "pqcmm-${RELEASE_TAG}.zip" "pqcmm-${RELEASE_TAG}"
          sha256sum "pqcmm-${RELEASE_TAG}.tar.gz" "pqcmm-${RELEASE_TAG}.zip" > SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          dist/pqcmm-${{ github.ref_name }}.tar.gz
          dist/pqcmm-${{ github.ref_name }}.zip
          dist/SHA256SUMS
          --verify-tag
          --generate-notes
          --title "PQCMM ${{ github.ref_name }}"
