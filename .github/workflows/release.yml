name: Publish model release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate model package
        run: pnpm run validate

      - name: Build release archives
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p "dist/pqcmm-${RELEASE_TAG}"
          cp -R model profiles schemas README.md CONTRIBUTING.md LICENSE "dist/pqcmm-${RELEASE_TAG}/"
          cp model/pqcmm-model-1.1.0.yaml dist/
          cp profiles/pqcmm-self-assessment-profile-1.1.0.yaml dist/
          cp schemas/pqcmm-model.schema-1.1.0.json dist/
          cp schemas/assessment-profile.schema-1.1.0.json dist/
          tar -C dist -czf "dist/pqcmm-${RELEASE_TAG}.tar.gz" "pqcmm-${RELEASE_TAG}"
          cd dist
          zip -qr "pqcmm-${RELEASE_TAG}.zip" "pqcmm-${RELEASE_TAG}"
          sha256sum \
            assessment-profile.schema-1.1.0.json \
            pqcmm-model-1.1.0.yaml \
            pqcmm-model.schema-1.1.0.json \
            pqcmm-self-assessment-profile-1.1.0.yaml \
            "pqcmm-${RELEASE_TAG}.tar.gz" \
            "pqcmm-${RELEASE_TAG}.zip" > SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          dist/assessment-profile.schema-1.1.0.json
          dist/pqcmm-model-1.1.0.yaml
          dist/pqcmm-model.schema-1.1.0.json
          dist/pqcmm-self-assessment-profile-1.1.0.yaml
          dist/pqcmm-${{ github.ref_name }}.tar.gz
          dist/pqcmm-${{ github.ref_name }}.zip
          dist/SHA256SUMS
          --verify-tag
          --generate-notes
          --title "PQCMM ${{ github.ref_name }}"
