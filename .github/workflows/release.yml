name: Publish model release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:
          ref: ${{ github.event.release.tag_name || github.ref_name }}

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate model package
        run: pnpm run validate

      - name: Generate versioned release assets
        run: node scripts/release-snapshot.mjs

      - name: Build release archives
        env:
          TZ: UTC
        run: |
          source_epoch=$(git log -1 --format=%ct)
          find dist -exec touch -d "@${source_epoch}" {} +
          tar --sort=name --mtime="@${source_epoch}" --owner=0 --group=0 --numeric-owner -C dist -czf "dist/pqcmm-${RELEASE_TAG}.tar.gz" "pqcmm-${RELEASE_TAG}"
          cd dist
          zip -Xqr "pqcmm-${RELEASE_TAG}.zip" "pqcmm-${RELEASE_TAG}"
          sha256sum *.yaml *.json *.tar.gz *.zip > SHA256SUMS

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "PQCMM ${RELEASE_TAG}"
          fi
          existing_assets=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          for asset in dist/*.yaml dist/*.json "dist/pqcmm-${RELEASE_TAG}.tar.gz" "dist/pqcmm-${RELEASE_TAG}.zip" dist/SHA256SUMS; do
            name=$(basename "$asset")
            if printf '%s\n' "$existing_assets" | grep -Fxq "$name"; then
              mkdir -p existing-assets
              gh release download "$RELEASE_TAG" --pattern "$name" --dir existing-assets
              cmp "$asset" "existing-assets/$name"
            else
              gh release upload "$RELEASE_TAG" "$asset"
            fi
          done
