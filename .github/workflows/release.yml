name: Publish model release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate model package
        run: pnpm run validate

      - name: Verify snapshots and stage release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-snapshot.mjs --check --stage

      - name: Build release archives
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          tar -C dist -czf "dist/pqcmm-${RELEASE_TAG}.tar.gz" "pqcmm-${RELEASE_TAG}"
          cd dist
          zip -qr "pqcmm-${RELEASE_TAG}.zip" "pqcmm-${RELEASE_TAG}"
          sha256sum *.yaml *.json *.tar.gz *.zip > SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          dist/*.yaml
          dist/*.json
          dist/pqcmm-${{ github.ref_name }}.tar.gz
          dist/pqcmm-${{ github.ref_name }}.zip
          dist/SHA256SUMS
          --verify-tag
          --generate-notes
          --title "PQCMM ${{ github.ref_name }}"
